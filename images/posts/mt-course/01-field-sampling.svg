<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-label="空间中的矢量场与固定测点的时间序列"><rect width="900" height="400" fill="#f8fafc"/><g font-family="Arial,'Noto Sans CJK SC',sans-serif"><text x="28" y="36" font-size="22" font-weight="bold" fill="#172f49">场是空间中每一点的物理量；时间序列是其中一个点的记录</text><rect x="28" y="65" width="390" height="294" rx="12" fill="white" stroke="#cbd5e1"/><rect x="445" y="65" width="430" height="294" rx="12" fill="white" stroke="#cbd5e1"/><text x="54" y="99" font-size="18" fill="#334155">空间分布：E(x,y,t₀)</text><text x="470" y="99" font-size="18" fill="#334155">固定测点 P：Eₓ(t)</text><defs><marker id="a" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0L6 3L0 6Z" fill="#1784af"/></marker></defs><g stroke="#1784af" stroke-width="3" marker-end="url(#a)"><path d="M78 150l28 -22M170 150l42 -13M271 150l49 7M78 222l22 -26M170 225l40 -11M271 226l55 16M78 299l17 -22M170 304l34 -18M271 305l48 9"/></g><circle cx="212" cy="214" r="8" fill="#ed7d39"/><text x="225" y="206" font-size="19" fill="#a8490b">P</text><path d="M475 282H838M483 116V318" stroke="#94a3b8" stroke-width="2"/><path d="M483 207C512 158 540 158 568 207S625 256 653 207S711 158 739 207S796 256 824 207" fill="none" stroke="#1784af" stroke-width="4"/><text x="488" y="339" font-size="15" fill="#64748b">同一个位置，随时间振荡</text><text x="825" y="308" font-size="15" fill="#64748b">t →</text></g></svg>