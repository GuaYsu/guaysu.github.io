<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420"><rect width="960" height="420" fill="#f8fafc"/><g font-family="Arial,sans-serif"><text x="26" y="38" font-size="23" font-weight="bold" fill="#173650">四格模型：两条观测难以唯一决定四个未知数</text><rect x="41" y="80" width="370" height="295" rx="13" fill="#fff" stroke="#bfcfdf"/><rect x="506" y="80" width="414" height="295" rx="13" fill="#fff" stroke="#bfcfdf"/><g stroke="#68899e" stroke-width="2" fill="#e0ecf3"><rect x="122" y="136" width="111" height="90" fill="#d6e7ef"/><rect x="233" y="136" width="111" height="90" fill="#b8dbe7"/><rect x="122" y="226" width="111" height="90" fill="#c7c0e7"/><rect x="233" y="226" width="111" height="90" fill="#b7c7db"/></g><g font-size="19" fill="#183a52"><text x="160" y="184">m₁</text><text x="278" y="184">m₂</text><text x="160" y="276">m₃</text><text x="278" y="276">m₄</text></g><path d="M78 175H370M78 267H370" stroke="#d68236" stroke-width="4" stroke-dasharray="9 4"/><g fill="#b96a26" font-size="17"><text x="44" y="166">d₁</text><text x="44" y="260">d₂</text></g><g font-size="19" fill="#19384f"><text x="532" y="135">d₁ = m₁ + m₂</text><text x="532" y="171">d₂ = m₃ + m₄</text><text x="532" y="219">若 d₁=10：</text><text x="550" y="256">m₁=3, m₂=7 也可以</text><text x="550" y="292">m₁=6, m₂=4 也可以</text><text x="532" y="345" fill="#b77130">观测相同，内部组合不同</text></g></svg>