<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 400" role="img" aria-label="地表归一化边界、深处近似零场边界、不同截断深度的比较">
<rect width="920" height="400" fill="#f8fafc"/><g font-family="sans-serif"><text x="31" y="40" font-size="23" font-weight="bold" fill="#18344e">有限计算域 ≠ 无限深的地球</text><rect x="37" y="77" width="344" height="289" fill="#e1edf6" stroke="#9aaec2"/><rect x="484" y="77" width="350" height="289" fill="#e1edf6" stroke="#9aaec2"/><path d="M37 92H381M484 92H834" stroke="#886b42" stroke-width="4"/><path d="M37 243H381" stroke="#d16d4d" stroke-width="4" stroke-dasharray="8 5"/><path d="M484 345H834" stroke="#258da6" stroke-width="4" stroke-dasharray="8 5"/><text x="66" y="118" fill="#17344e" font-size="19">地表：E(0)=1（归一化）</text><text x="493" y="118" fill="#17344e" font-size="19">地表：E(0)=1（归一化）</text><text x="64" y="238" fill="#ad513e" font-size="18">截得太浅</text><text x="496" y="335" fill="#0f7d94" font-size="18">截得更深</text><path d="M119 130C182 149 222 194 227 242" fill="none" stroke="#df764a" stroke-width="5"/><path d="M582 129C639 161 654 218 662 269S669 319 672 344" fill="none" stroke="#1387a7" stroke-width="5"/><text x="64" y="320" font-size="16" fill="#5c6c7d">下边界若过近，会干扰地表解</text><text x="495" y="378" font-size="16" fill="#5c6c7d">足够深时，底部衰减更充分</text></g></svg>