<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430"><rect width="960" height="430" fill="#f8fafc"/><g font-family="Arial,sans-serif"><text x="32" y="41" font-size="24" fill="#17364f" font-weight="bold">不同的地下模型，也可能解释相同的观测</text><g fill="white" stroke="#c6d5e0"><rect x="29" y="67" width="422" height="304" rx="12"/><rect x="504" y="67" width="422" height="304" rx="12"/></g><text x="49" y="103" font-size="20" fill="#26455b">模型 A：较厚、较高电阻率</text><text x="524" y="103" font-size="20" fill="#26455b">模型 B：较薄、较低电阻率</text><g><rect x="73" y="136" width="332" height="86" fill="#d8e5ef"/><rect x="73" y="222" width="332" height="77" fill="#d6ab6f"/><rect x="73" y="299" width="332" height="52" fill="#d8e5ef"/><rect x="551" y="136" width="332" height="124" fill="#d8e5ef"/><rect x="551" y="260" width="332" height="38" fill="#a5653e"/><rect x="551" y="298" width="332" height="53" fill="#d8e5ef"/></g><g fill="#233f55" font-size="18"><text x="166" y="268">导电层</text><text x="692" y="284">导电层</text></g><path d="M431 225Q479 194 524 225" fill="none" stroke="#1483a7" stroke-width="3"/><text x="480" y="189" text-anchor="middle" fill="#167e9d" font-size="18">响应可相近</text><text x="480" y="403" text-anchor="middle" fill="#52697c" font-size="17">地表有限频带的数据可能难以同时约束层厚与电阻率</text></g></svg>