<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" role="img" aria-label="浅部沉积层、结晶地壳、岩石圈地幔和软流圈相对电性示意"><rect width="960" height="430" fill="#f8fafc"/><g font-family="Arial,sans-serif"><text x="28" y="42" fill="#193d55" font-size="24" font-weight="bold">垂向电性结构示意：这些层的电阻率没有固定答案</text><g stroke="#f1f5f8" stroke-width="2"><rect x="39" y="78" width="440" height="49" fill="#d8c5a7"/><rect x="39" y="127" width="440" height="89" fill="#a7bdc7"/><rect x="39" y="216" width="440" height="82" fill="#728eab"/><rect x="39" y="298" width="440" height="97" fill="#c8836d"/></g><g fill="#1b394d" font-size="18"><text x="56" y="108">沉积物 / 盆地</text><text x="56" y="174">结晶地壳</text><text x="56" y="259" fill="white">岩石圈地幔</text><text x="56" y="355" fill="white">软流圈</text></g><rect x="514" y="99" width="414" height="282" rx="15" fill="white" stroke="#bed0dd"/><g fill="#284c62" font-size="19"><text x="541" y="144">孔隙盐水 → 可能导电</text><text x="541" y="207">冷而干的结晶岩 → 常较高阻</text><text x="541" y="270">温度、挥发分与熔体可改变响应</text><text x="541" y="333">区域差异与模型分辨率不能省略</text></g></g></svg>