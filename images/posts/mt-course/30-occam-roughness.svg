<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 970 400"><rect width="970" height="400" fill="#f8fafc"/><g font-family="Arial,sans-serif"><text x="26" y="38" font-size="23" font-weight="bold" fill="#19364f">两种模型都能解释数据，为什么会偏向较平滑的一种？</text><g fill="#fff" stroke="#c6d4df"><rect x="25" y="68" width="433" height="294" rx="12"/><rect x="504" y="68" width="436" height="294" rx="12"/></g><g font-size="20" fill="#28445b"><text x="43" y="104">模型 A：邻层变化剧烈</text><text x="524" y="104">模型 B：随深度平缓变化</text></g><path d="M78 138V324H425M552 138V324H909" fill="none" stroke="#8497a7" stroke-width="2"/><path d="M80 175H133V272H189V166H246V299H304V187H365V251H423" fill="none" stroke="#d97949" stroke-width="5"/><path d="M555 181C616 190 652 222 716 236S845 250 909 282" fill="none" stroke="#1583a7" stroke-width="5"/><g fill="#556b7c" font-size="16"><text x="90" y="344">深度 z →</text><text x="566" y="344">深度 z →</text></g><g fill="#c0753d" font-size="18"><text x="123" y="388">若拟合改善很少，复杂起伏未必有依据</text></g></g></svg>