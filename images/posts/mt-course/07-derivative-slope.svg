<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 430" role="img" aria-label="用一条直线近似曲线在某一点的斜率：两点越来越近，割线趋向切线"><rect width="920" height="430" fill="#f8fafc"/><g font-family="Arial,'Noto Sans CJK SC',sans-serif"><text x="34" y="42" font-size="23" font-weight="bold" fill="#18344b">导数：把两点之间的平均变化率，缩小到一个点附近</text><rect x="28" y="62" width="548" height="337" rx="14" fill="#fff" stroke="#c5d1dc"/><path d="M85 363H532M108 372V93" stroke="#718096" stroke-width="2.5"/><text x="521" y="386" fill="#475569" font-size="18">z</text><text x="66" y="100" fill="#475569" font-size="18">E</text><path d="M108 351 C190 335 230 294 282 241 S396 127 514 111" fill="none" stroke="#167da4" stroke-width="5"/><path d="M210 313L424 125" stroke="#e38d35" stroke-width="3"/><circle cx="264" cy="267" r="7" fill="#167da4"/><circle cx="373" cy="171" r="7" fill="#e38d35"/><line x1="264" y1="267" x2="373" y2="267" stroke="#d27a31" stroke-width="2" stroke-dasharray="6 5"/><line x1="373" y1="267" x2="373" y2="171" stroke="#d27a31" stroke-width="2" stroke-dasharray="6 5"/><text x="309" y="292" font-size="20" fill="#bd6b20">Δz</text><text x="385" y="226" font-size="20" fill="#bd6b20">ΔE</text><text x="221" y="263" font-size="16" fill="#18344b">A</text><text x="384" y="159" font-size="16" fill="#18344b">B</text><rect x="603" y="93" width="286" height="248" rx="14" fill="#eff6fb" stroke="#bbccdd"/><text x="626" y="138" font-size="19" fill="#17344f">两点间的平均斜率</text><text x="645" y="185" font-size="26" font-weight="bold" fill="#127ca5">ΔE / Δz</text><text x="626" y="239" font-size="18" fill="#334155">把 B 逐渐移向 A</text><text x="626" y="270" font-size="18" fill="#334155">割线 → 切线</text><text x="626" y="303" font-size="18" fill="#334155">平均变化 → 局部变化</text></g></svg>