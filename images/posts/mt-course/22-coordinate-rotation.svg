<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 400" role="img" aria-label="测量坐标轴与地下地质走向夹角和旋转"><rect width="940" height="400" fill="#f8fafc"/><g font-family="Arial,sans-serif"><text x="30" y="40" font-size="24" fill="#173850" font-weight="bold">同一个电场，换一组坐标，分量数字就改变</text><rect x="28" y="65" width="575" height="298" rx="14" fill="white" stroke="#c4d3e0"/><circle cx="286" cy="231" r="6" fill="#193b55"/><g stroke-width="3"><path d="M105 231H541M286 347V86" stroke="#8298ab"/><path d="M174 351L399 97M142 117L457 348" stroke="#dc8643" stroke-dasharray="8 5"/><path d="M286 231L397 136" stroke="#1389ac" stroke-width="5"/></g><g fill="#183850" font-size="19"><text x="544" y="238">x</text><text x="299" y="93">y</text><text x="394" y="103" fill="#c57b38">x′</text><text x="460" y="352" fill="#c57b38">y′</text><text x="400" y="133" fill="#1389ac">E</text></g><path d="M355 231A69 69 0 0 0 331 179" stroke="#cf822f" stroke-width="3" fill="none"/><text x="359" y="200" font-size="18" fill="#b16c2e">θ</text><rect x="629" y="103" width="284" height="220" rx="14" fill="#e9f3f8" stroke="#b9d1de"/><g fill="#284a60" font-size="20"><text x="652" y="148">向量没有发生变化</text><text x="652" y="200">旧分量：(Eₓ, Eᵧ)</text><text x="652" y="250">新分量：(E′ₓ, E′ᵧ)</text><text x="652" y="294">E′ = R E</text></g></g></svg>