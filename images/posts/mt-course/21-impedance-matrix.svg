<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 390" role="img" aria-label="阻抗矩阵如何将两个磁场输入映射到两个电场分量"><rect width="940" height="390" fill="#f8fafc"/><g font-family="Arial,sans-serif"><text x="29" y="40" font-size="24" font-weight="bold" fill="#183950">阻抗张量：两个输入分量 → 两个输出分量</text><g fill="white" stroke="#b3c5d4" stroke-width="2"><rect x="31" y="102" width="220" height="222" rx="14"/><rect x="357" y="102" width="230" height="222" rx="14"/><rect x="692" y="102" width="216" height="222" rx="14"/></g><g fill="#254b63" font-size="19" text-anchor="middle"><text x="140" y="140">磁场输入</text><text x="473" y="140">阻抗矩阵 Z</text><text x="800" y="140">电场输出</text></g><g fill="#2185aa" font-size="27" text-anchor="middle"><text x="141" y="207">Hₓ</text><text x="141" y="272">Hᵧ</text></g><g fill="#ad6f31" font-size="26" text-anchor="middle"><text x="798" y="207">Eₓ</text><text x="798" y="272">Eᵧ</text></g><g font-size="25" fill="#2e5268" text-anchor="middle"><text x="470" y="203">Zₓₓ   Zₓᵧ</text><text x="470" y="275">Zᵧₓ   Zᵧᵧ</text></g><g stroke="#2389a8" stroke-width="4"><path d="M258 213H346 M597 213H685"/></g><g fill="#2389a8"><path d="M345 213l-13 -8v16z M684 213l-13 -8v16z"/></g><text x="469" y="363" text-anchor="middle" font-size="16" fill="#54687a">每个 Z 都是随频率变化的复数系数</text></g></svg>