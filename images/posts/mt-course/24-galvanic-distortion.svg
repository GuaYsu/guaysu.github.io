<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 410" role="img" aria-label="近地表导电小体导致测量电场幅度或方向发生畸变"><rect width="920" height="410" fill="#f8fafc"/><g font-family="Arial,sans-serif"><text x="30" y="39" fill="#17384e" font-weight="bold" font-size="23">近地表导体：能改变局部电场，却不一定代表深部结构</text><rect x="27" y="67" width="530" height="300" rx="14" fill="#f2eee4" stroke="#bfc9ce"/><path d="M39 135H544" stroke="#6f8796" stroke-width="3"/><ellipse cx="309" cy="170" rx="62" ry="26" fill="#5389a3" stroke="#2a607b" stroke-width="3"/><g stroke="#b48a51" fill="none" stroke-width="3"><path d="M68 111H213Q261 112 258 144T256 201H217L68 204"/><path d="M68 227H214Q263 219 262 186T280 153"/><path d="M362 149Q372 125 413 113H516"/><path d="M363 193Q390 226 440 225H516"/></g><g fill="#b48a51"><path d="M215 111l-10 -6v12z M517 113l-10 -6v12z M517 225l-10 -6v12z"/></g><g fill="#1a455e" font-size="16"><text x="56" y="98">区域电场</text><text x="272" y="173" fill="white">小导体</text><text x="62" y="330">局部电流绕流、界面电荷积累</text></g><rect x="593" y="91" width="297" height="239" rx="14" fill="#eaf3f9" stroke="#bdcedb"/><g fill="#1e4561" font-size="20"><text x="618" y="139">区域电场：E_reg</text><text x="618" y="192">测到的电场：E_obs</text><text x="618" y="245">E_obs = C E_reg</text></g><text x="619" y="294" fill="#536a7a" font-size="16">C：实数畸变矩阵（理想近似）</text></g></svg>