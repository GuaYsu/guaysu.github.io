<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" role="img" aria-label="旋度的简单例子：电场 x 分量随深度 z 增大，小回路上下边的环流贡献不同"><rect width="960" height="440" fill="#f8fafc"/><g font-family="Arial,'Noto Sans CJK SC',sans-serif"><text x="31" y="41" font-size="23" font-weight="bold" fill="#18344b">旋度：比较一条很小的闭合回路四周，沿回路方向的场</text><rect x="30" y="67" width="579" height="333" rx="12" fill="#fff" stroke="#c5d1dc"/><path d="M76 125V353M76 125H555" stroke="#94a3b8" stroke-width="2.5"/><text x="563" y="129" font-size="17" fill="#475569">x →</text><text x="79" y="375" font-size="17" fill="#475569">z ↓</text><g stroke="#1786ac" fill="none" stroke-linecap="round"><path d="M145 163H185M255 163H295M365 163H405M145 237H224M255 237H334M365 237H444M145 311H269M275 311H399M405 311H529" stroke-width="4"/></g><g fill="#1786ac"><path d="M187 163l-11 -7v14z M297 163l-11 -7v14z M407 163l-11 -7v14z M226 237l-11 -7v14z M336 237l-11 -7v14z M446 237l-11 -7v14z M271 311l-11 -7v14z M401 311l-11 -7v14z M531 311l-11 -7v14z"/></g><rect x="257" y="171" width="213" height="129" fill="none" stroke="#e4862a" stroke-width="3" stroke-dasharray="7 4"/><path d="M285 174H380M459 194V254M442 299H350M259 272V212" stroke="#e4862a" fill="none" stroke-width="3"/><text x="288" y="160" fill="#ac6024" font-size="17">上边</text><text x="287" y="327" fill="#ac6024" font-size="17">下边：Eₓ 较大</text><rect x="635" y="80" width="291" height="303" rx="12" fill="#eff6fb" stroke="#c4d4df"/><text x="659" y="124" font-size="20" fill="#17344f">当 Eₓ 随 z 改变</text><text x="659" y="164" font-size="18" fill="#334155">回路上、下边</text><text x="659" y="191" font-size="18" fill="#334155">的场可能不同</text><text x="659" y="242" font-size="18" fill="#334155">因此闭合环路的</text><text x="659" y="270" font-size="18" fill="#334155">场的环流可不为零</text><text x="659" y="327" font-size="17" fill="#187fa8">这与旋度有关</text></g></svg>