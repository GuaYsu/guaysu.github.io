<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-label="一维层状模型和不同周期的电磁探测深度"><rect width="900" height="400" fill="#f8fafc"/><g font-family="Arial,'Noto Sans CJK SC',sans-serif"><text x="28" y="34" font-size="22" fill="#17334e" font-weight="bold">一维层状地球：电阻率只随深度 z 改变</text><path d="M80 75H820" stroke="#64748b" stroke-width="3"/><rect x="80" y="77" width="740" height="75" fill="#e8d4ae"/><rect x="80" y="152" width="740" height="84" fill="#8db6bd"/><rect x="80" y="236" width="740" height="128" fill="#b0a4c8"/><g font-size="22" fill="#1e293b"><text x="115" y="124">第一层：ρ₁ = 100 Ω·m</text><text x="115" y="203">第二层：ρ₂ = 10 Ω·m</text><text x="115" y="304">第三层：ρ₃ = 1000 Ω·m（半空间）</text></g><g fill="none" stroke-width="3" stroke-dasharray="8 5"><path d="M680 82V134" stroke="#d16451"/><path d="M730 82V218" stroke="#cc8d36"/><path d="M780 82V345" stroke="#4d61bf"/></g><g font-size="14"><text x="612" y="66" fill="#d16451">短周期</text><text x="710" y="66" fill="#4d61bf">长周期</text></g><text x="842" y="360" fill="#334155" font-size="16">z ↓</text></g></svg>