<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 930 390" role="img" aria-label="不同厚度电阻率的薄导电层具有相同纵向电导示意">
<rect width="930" height="390" fill="#f8fafc"/><g font-family="sans-serif"><text x="29" y="40" font-size="23" font-weight="bold" fill="#17344f">薄导电层：厚度 h 和电阻率 ρ 可以相互补偿</text><g fill="white" stroke="#bbcbd9"><rect x="34" y="68" width="267" height="260" rx="12"/><rect x="331" y="68" width="267" height="260" rx="12"/><rect x="628" y="68" width="267" height="260" rx="12"/></g><g fill="#d8e3eb"><rect x="58" y="126" width="220" height="66"/><rect x="58" y="257" width="220" height="48"/><rect x="355" y="126" width="220" height="104"/><rect x="355" y="245" width="220" height="60"/><rect x="652" y="126" width="220" height="124"/><rect x="652" y="270" width="220" height="35"/></g><g fill="#277fa6"><rect x="58" y="192" width="220" height="65"/><rect x="355" y="230" width="220" height="15"/><rect x="652" y="250" width="220" height="20"/></g><g fill="#18364c" font-size="19"><text x="61" y="103">厚层：10 Ω·m</text><text x="359" y="103">薄层：1 Ω·m</text><text x="656" y="103">极薄：0.1 Ω·m</text></g><g fill="#29485e" font-size="16"><text x="64" y="343">h = 10 km</text><text x="361" y="343">h = 1 km</text><text x="658" y="343">h = 0.1 km</text><text x="64" y="366">S = h/ρ = 1 km/(Ω·m)</text><text x="360" y="366">S = h/ρ = 1 km/(Ω·m)</text><text x="656" y="366">S = h/ρ = 1 km/(Ω·m)</text></g></g></svg>