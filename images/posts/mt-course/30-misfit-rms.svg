<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 930 395"><rect width="930" height="395" fill="#f8fafc"/><g font-family="Arial,sans-serif"><text x="27" y="41" font-size="24" font-weight="bold" fill="#17384f">残差要先除以各自的不确定度，才能合理合计</text><rect x="34" y="72" width="858" height="276" rx="13" fill="white" stroke="#c0d1dd"/><g fill="#1f435c" font-size="20"><text x="70" y="117">同样偏差 2 个单位</text><text x="70" y="194">测量 A：σ = 1</text><text x="70" y="277">测量 B：σ = 4</text></g><g fill="#177fa7"><rect x="365" y="167" width="390" height="34" rx="5"/><rect x="365" y="249" width="98" height="34" rx="5"/></g><g fill="#1c485d" font-size="19"><text x="778" y="192">标准化残差 = 2</text><text x="482" y="275">标准化残差 = 0.5</text><text x="70" y="321" font-size="16" fill="#6d8090">同样差值并不代表相同的统计失配</text></g></svg>