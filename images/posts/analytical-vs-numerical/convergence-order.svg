<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="660" viewBox="0 0 1100 660">
  <rect width="1100" height="660" fill="#ffffff"/>
  <style>
    .t{font-family:Arial,"Noto Sans SC","Microsoft YaHei",sans-serif;fill:#222}
    .h{font-size:30px;font-weight:700}.b{font-size:21px}.s{font-size:18px;fill:#555}
    .axis{stroke:#222;stroke-width:2}.grid{stroke:#ddd;stroke-width:1}
    .first{stroke:#8a4f2c;stroke-width:3;fill:none;stroke-dasharray:12 9}
    .second{stroke:#315a7d;stroke-width:4;fill:none}
    .pt1{fill:#8a4f2c}.pt2{fill:#315a7d}
  </style>
  <text x="65" y="55" class="t h">收敛阶比单个误差值更有诊断意义</text>
  <line x1="130" y1="550" x2="1010" y2="550" class="axis"/>
  <line x1="130" y1="95" x2="130" y2="550" class="axis"/>
  <line x1="130" y1="435" x2="1010" y2="435" class="grid"/>
  <line x1="130" y1="320" x2="1010" y2="320" class="grid"/>
  <line x1="130" y1="205" x2="1010" y2="205" class="grid"/>

  <text x="565" y="615" text-anchor="middle" class="t b">网格分辨率提高 →</text>
  <text x="42" y="325" transform="rotate(-90 42 325)" text-anchor="middle" class="t b">误差（对数尺度）</text>

  <path d="M185 205 L400 285 L615 365 L830 445" class="first"/>
  <circle cx="185" cy="205" r="7" class="pt1"/><circle cx="400" cy="285" r="7" class="pt1"/><circle cx="615" cy="365" r="7" class="pt1"/><circle cx="830" cy="445" r="7" class="pt1"/>

  <path d="M185 170 L400 285 L615 405 L830 520" class="second"/>
  <circle cx="185" cy="170" r="7" class="pt2"/><circle cx="400" cy="285" r="7" class="pt2"/><circle cx="615" cy="405" r="7" class="pt2"/><circle cx="830" cy="520" r="7" class="pt2"/>

  <line x1="690" y1="125" x2="750" y2="125" class="first"/><text x="765" y="132" class="t s">一阶趋势：误差 ∝ h</text>
  <line x1="690" y1="160" x2="750" y2="160" class="second"/><text x="765" y="167" class="t s">二阶趋势：误差 ∝ h²</text>

  <text x="130" y="590" class="t s">示意关系：若网格尺度减半，二阶方法进入渐近区间后，误差理论上约缩小至原来的 1/4。</text>
</svg>